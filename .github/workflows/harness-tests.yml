name: Harness Tests

on:
  workflow_dispatch:
  workflow_call:

env:
  # Fork PRs get no secrets, so they skip the vault and build from Maven Central only.
  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  harness-tests:
    name: Harness Tests - Cassandra 5
    runs-on: ubuntu-latest
    steps:
      - name: Get the GPM token from vault
        if: env.IS_FORK_PR != 'true'
        uses: liquibase/build-logic/.github/actions/setup-aws-vault@adee5f2b8709f6cd43684a5de0a8e0128bafc4eb # main
        with:
          group: liquibot-github-pat
          role-arn: ${{ secrets.VAULT_GROUPED_LIQUIBOT_GITHUB_PAT_ROLE_ARN }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: "3.9.5"

      - name: Set up Maven settings.xml
        if: env.IS_FORK_PR != 'true'
        uses: liquibase/build-logic/.github/actions/setup-maven-settings@5ac918e7d6ab07f75e2a0a26261577f9c5df15d4 # main
        with:
          gpm-token: ${{ env.LIQUIBOT_PAT_GPM_ACCESS }}

      - name: Start Cassandra 5
        working-directory: src/test/resources/docker
        run: |
          docker compose up -d cassandra-5
          echo "Waiting for Cassandra 5 to be healthy..."
          docker compose up cassandra-init-5
          echo "Cassandra 5 is ready."

      - name: Run Harness Tests
        run: mvn -ntp -Dtest="LiquibaseHarnessSuiteIT" test

      - name: Stop Cassandra
        if: always()
        working-directory: src/test/resources/docker
        run: docker compose down --volumes

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-test-results
          path: |
            target/surefire-reports/
            target/spock-reports/
