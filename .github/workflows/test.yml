name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  pull-requests: write
  packages: read
  id-token: write

jobs:
  build-test:
    uses: liquibase/build-logic/.github/workflows/os-extension-test.yml@main
    secrets: inherit

  harness-tests:
    uses: ./.github/workflows/harness-tests.yml
    secrets: inherit

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.LIQUIBASE_VAULT_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get secrets from vault
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            ,/vault/liquibase
          parse-json-secrets: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@d6af6abeda15e98926a57b5aa970a96bb37f97d1 # v5
        with:
          maven-version: "3.9.5"

      - name: Set up Maven settings.xml
        uses: liquibase/build-logic/.github/actions/setup-maven-settings@5ac918e7d6ab07f75e2a0a26261577f9c5df15d4 # main
        with:
          gpm-token: ${{ env.LIQUIBOT_PAT_GPM_ACCESS }}

      - name: Start Cassandra 5
        working-directory: src/test/resources/docker
        run: |
          docker compose up -d cassandra-5
          echo "Waiting for Cassandra 5 to be healthy..."
          docker compose up cassandra-init-5
          echo "Cassandra 5 is ready."

      - name: Run Functional Tests
        run: |
          mvn -ntp \
            -Dtest="CassandraFunctionalIT" \
            -DdbUrl="jdbc:cassandra://localhost:9045/betterbotz?compliancemode=Liquibase&localdatacenter=datacenter1" \
            test

      - name: Stop Cassandra
        if: always()
        working-directory: src/test/resources/docker
        run: docker compose down --volumes

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-test-results
          path: |
            target/surefire-reports/
            target/spock-reports/
